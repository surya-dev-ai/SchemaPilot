[project]
name = "schemapilot"
version = "0.1.0"
description = "SchemaPilot API foundation for natural-language PostgreSQL migration planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["demo/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need the disposable bookstore PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "alembic"]
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
