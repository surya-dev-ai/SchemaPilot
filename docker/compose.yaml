services:
  app-db:
    image: postgres:16-alpine
    container_name: schemapilot-app-db
    environment:
      POSTGRES_USER: ${SCHEMAPILOT_APP_DB_USER:-schemapilot}
      POSTGRES_PASSWORD: ${SCHEMAPILOT_APP_DB_PASSWORD:-change_me_local_app}
      POSTGRES_DB: ${SCHEMAPILOT_APP_DB_NAME:-schemapilot}
    ports:
      - "5432:5432"
    volumes:
      - schemapilot_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-db:
    image: postgres:16-alpine
    container_name: schemapilot-demo-db
    environment:
      POSTGRES_USER: ${SCHEMAPILOT_DEMO_DB_USER:-schemapilot_demo}
      POSTGRES_PASSWORD: ${SCHEMAPILOT_DEMO_DB_PASSWORD:-change_me_local_demo}
      POSTGRES_DB: ${SCHEMAPILOT_DEMO_DB_NAME:-schemapilot_bookstore}
    ports:
      - "5434:5432"
    volumes:
      - schemapilot_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox-db:
    image: postgres:16-alpine
    container_name: schemapilot-sandbox-db
    environment:
      POSTGRES_USER: ${SCHEMAPILOT_SANDBOX_DB_USER:-schemapilot_sandbox}
      POSTGRES_PASSWORD: ${SCHEMAPILOT_SANDBOX_DB_PASSWORD:-change_me_local_sandbox}
      POSTGRES_DB: ${SCHEMAPILOT_SANDBOX_DB_NAME:-schemapilot_sandbox}
    ports:
      - "5433:5432"
    volumes:
      - schemapilot_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schemapilot_app_data:
  schemapilot_sandbox_data:
  schemapilot_demo_data:
